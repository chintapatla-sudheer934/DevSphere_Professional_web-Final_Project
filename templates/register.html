
{% extends "base.html" %}
{% block title %}Register | DevSphere{% endblock %}
{% block content %}
<div class="auth-wrap">
<form class="auth-card" method="POST">
<span class="eyebrow">START BUILDING</span>
<h1>Create your account</h1>
<p>Set up your professional developer workspace.</p>
<label>Full Name</label><input name="name" required placeholder="Your name">
<label>Email</label><input type="email" name="email" required placeholder="you@example.com">
<label>Password</label><input type="password" name="password" minlength="6" required placeholder="At least 6 characters">
<button class="btn primary full">Create Account</button>
<p class="center">Already registered? <a href="{{url_for('login')}}">Sign in</a></p>
</form>
</div>
{% endblock %}
