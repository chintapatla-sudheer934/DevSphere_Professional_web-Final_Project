
{% extends "base.html" %}
{% block title %}Login | DevSphere{% endblock %}
{% block content %}
<div class="auth-wrap">
<form class="auth-card" method="POST">
<span class="eyebrow">WELCOME BACK</span>
<h1>Sign in to DevSphere</h1>
<p>Continue working on your projects.</p>
<label>Email</label><input type="email" name="email" required placeholder="you@example.com">
<label>Password</label><input type="password" name="password" required placeholder="••••••••">
<button class="btn primary full">Sign In</button>
<p class="center">Don't have an account? <a href="{{url_for('register')}}">Create one</a></p>
</form>
</div>
{% endblock %}
